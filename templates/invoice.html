<html>
<body style='font-family: Arial, sans-serif; line-height: 1.6; color: #333;'>
<div style='max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 20px;'>
<h2 style='color: #2c3e50; text-align: center;'>INVOICE</h2>
<hr>
<p><strong>Billed To:</strong> {{client_name}}</p>
<p><strong>Date:</strong> {{date}}</p>
<table style='width: 100%; border-collapse: collapse; margin-top: 20px;'>
<thead>
<tr style='background-color: #f2f2f2;'>
<th style='padding: 10px; border: 1px solid #ddd; text-align: left;'>Description</th>
<th style='padding: 10px; border: 1px solid #ddd; text-align: right;'>Amount (INR)</th>
</tr>
</thead>
<tbody>
<tr>
<td style='padding: 10px; border: 1px solid #ddd;'>Item Purchase</td>
<td style='padding: 10px; border: 1px solid #ddd; text-align: right;'>{{base_amount}}</td>
</tr>
<tr>
<td style='padding: 10px; border: 1px solid #ddd;'>GST (17%)</td>
<td style='padding: 10px; border: 1px solid #ddd; text-align: right;'>{{gst_amount}}</td>
</tr>
<tr>
<td style='padding: 10px; border: 1px solid #ddd;'>Other Taxes (12%)</td>
<td style='padding: 10px; border: 1px solid #ddd; text-align: right;'>{{other_taxes}}</td>
</tr>
<tr style='font-weight: bold; background-color: #f9f9f9;'>
<td style='padding: 10px; border: 1px solid #ddd;'>Total Amount</td>
<td style='padding: 10px; border: 1px solid #ddd; text-align: right;'>{{total_amount}}</td>
</tr>
</tbody>
</table>
<p style='margin-top: 30px;'>Thank you for your business!</p>
<p>Best regards,<br>{{sender_name}}</p>
</div>
</body>
</html>
